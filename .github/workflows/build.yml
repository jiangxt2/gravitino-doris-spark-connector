name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standalone-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - name: Resolve published dependencies and assemble distribution from an empty cache
        run: ./gradlew --no-daemon installDist
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gravitino-doris-empty-gradle-home

  unit:
    needs: standalone-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify standalone build
        run: ./gradlew --no-daemon spotlessCheck test installDist
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"

  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        doris: ["3.0.6.2", "4.0.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Gravitino, Spark, and Doris integration tests
        run: ./gradlew --no-daemon integrationTest -PdorisVersion=${{ matrix.doris }}
      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p /tmp/container-logs
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' \
            > /tmp/container-logs/containers.txt
          for c in $(docker ps -aq); do
            name=$(docker inspect -f '{{.Name}}' "$c" | tr -d '/')
            docker logs "$c" > "/tmp/container-logs/$name.log" 2>&1 || true
          done
      - name: Upload integration reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ matrix.doris }}
          path: |
            integration-tests/build/reports/tests/**
            integration-tests/build/test-results/**
            /tmp/container-logs/**
